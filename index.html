<!DOCTYPE html>
<html>
<head>
    <title>Тест картинок</title>
</head>
<body>
    <img id="testImg" style="width:100%; height:100%;">
    
    <script>
        // Простой тест загрузки
        const images = [
            'empty.png',
            'missing.png', 
            '03.png',
            'readyto.png',
            'tosleep.png'
        ];
        
        let current = 0;
        const img = document.getElementById('testImg');
        
        function loadNext() {
            const file = images[current];
            console.log("Пробуем загрузить:", file);
            
            img.onload = () => {
                console.log("✓ Успех:", file);
                current = (current + 1) % images.length;
                setTimeout(loadNext, 3000);
            };
            
            img.onerror = () => {
                console.log("✗ Ошибка:", file);
                current = (current + 1) % images.length;
                setTimeout(loadNext, 1000);
            };
            
            // Добавляем временную метку чтобы избежать кеша
            img.src = file + '?t=' + Date.now();
        }
        
        // Начинаем тест
        loadNext();
    </script>
</body>
</html>
